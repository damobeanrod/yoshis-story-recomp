[input]
output_func_path = "recomp_funcs"
elf_path = "../yoshis-story-matching/build/yoshisstory-us.elf"
rom_file_path = "../yoshis-story-matching/baseroms/us/baserom.z64"
recomp_include = "#include \"recomp.h\""
single_file_output = false
functions_per_output_file = 100
# The 304 relocatable overlays split out of ROM by tools/find_overlays.py
# (decomp yamls/us/overlays.yaml). Their code is registered at its loaded
# address by the Overlay_Load hook (see src/main.cpp yoshi_overlay_load).
relocatable_sections_path = "overlay_sections.txt"
# splat names each overlay's BSS ".ovl_XXXXXX_bss"; pair it with its code
# section so relocations into BSS are remapped relative to the load address
# (N64Recomp's default suffix is ".bss").
bss_section_suffix = "_bss"

# The ELF must come from a MATCHING decomp build: N64Recomp takes code from
# the ELF, but librecomp loads data from the retail ROM at runtime, so any
# layout drift breaks data reads and function-pointer dispatch. Check with:
#   tools/check_elf_matches.py --elf <elf> --rom <baserom.z64>
