[patches]
# Previous stubs (func_80072FF0, func_800716C0, func_800716F8, Fault_HungUp,
# func_80009930) worked around hangs caused by recompiling a non-matching
# ELF. Start empty against the matching ELF; re-add only with a fresh reason.
stubs = [
    # The ~300 stubs that used to be here were all the last function of an
    # overlay, sized past its code into data by an old gen_function_sizes.py.
    # tools/regen.py re-adds anything N64Recomp still genuinely fails on.
]

# Route the game's debug output to stderr (see src/main.cpp). The retail
# osSyncPrintf is an empty stub, but callers still pass format + args.
[[patches.hook]]
func = "osSyncPrintf"
text = "yoshi_sync_printf(rdram, ctx);"

[[patches.hook]]
func = "Fault_HungUp"
text = "yoshi_report_hungup(rdram, ctx);"

# Register recompiled overlay code at the address the game loads each .ovl to.
[[patches.hook]]
func = "Overlay_Load"
text = "yoshi_overlay_load(rdram, ctx);"


# func_8000AD10 is libultra osAiSetNextBuffer (unnamed in the decomp): the
# game's copy writes AI registers that don't exist here. Hand the buffer to
# the runtime and skip the body.
[[patches.hook]]
func = "func_8000AD10"
before_vram = 0x8000AD10
text = "yoshi_ai_set_next_buffer(rdram, ctx); return;"